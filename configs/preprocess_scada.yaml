# SCADA数据处理配置文件
# 用于配置SCADA数据处理管道的参数

# -------------------------------------------------
# 项目根路径（由代码在运行时自动计算）
# -------------------------------------------------
project:
  root: "__PROJECT_ROOT__"

# -------------------------------------------------
# 数据源配置
# -------------------------------------------------
data:
  # 输入文件路径（Excel或CSV，包含所有数据定位信息）
  source_excel: 'D:\data\21004_sc_pitchbatteryvoltagelowa1.xlsx'
  
  # 处理后数据输出目录
  processed_dir: 'D:\data\scada_processed'

# -------------------------------------------------
# Excel列名映射
# -------------------------------------------------
excel:
  # SCADA路径所在列
  scada_path_column: 'scada_path'
  
  # 故障时间列
  fault_time_column: 'fault_time'
  
  # 标签列
  label_column: 'label'


# -------------------------------------------------
# 时间窗口配置
# -------------------------------------------------
time_window:
  start_offset: -7200  # 故障前数据点数
  end_offset: 1200     # 故障后数据点数
  # 注意: 这里是数据点数量,不是时间范围
  # 例如(-600, 600)表示故障时刻前后各取600个数据点,共1201个点

# -------------------------------------------------
# 标签点配置
# -------------------------------------------------
tags:
  mapping_file: configs/scada_tag_info.xlsx  # 标签映射文件路径
  default_tags:
    - grPitchBackupVoltage1
    - grPitchBackupVoltage2
    - grPitchBackupVoltage3
    - grSlaveBackupVoltageA1
    - grSlaveBackupVoltageA2
    - grSlaveBackupVoltageA3

# -------------------------------------------------
# 数据处理参数
# -------------------------------------------------
data_processing:
  min_rows_after_window: 5           # 时间窗口截取后的最小行数
  time_offset_threshold: 10000       # 时间偏置校正阈值
  column_offset_check_range: 5       # 列偏移检测范围
  time_value_threshold: -100         # 判断是否为时间列的最小值
  
  # 缺失值处理策略
  missing_channel_strategy: 'zero'   # 可选: 'zero', 'nan', 'skip'
  add_missing_indicator: false       # 缺失指示器（树模型不需要）

# -------------------------------------------------
# 特征提取配置
# -------------------------------------------------
feature_extraction:
  general:
    # 故障时间从输入文件的fault_time_column列动态读取
    multi_channels: []
    fault_timestamp: 0

  stat:
    epsilon: 1e-8                    # 防除零常数
    stability_segments: 4            # 稳定性分段数
    mutation_std_ratio: 1.5          # 突变检测标准差倍数
    min_len_mutation: 10             # 突变检测最小长度

  dynamic:
    window_pre_fault: 600            # 故障前窗口大小（与time_window一致）
    window_transient: 100            # 瞬态过程窗口
    window_post_fault: 600           # 故障后窗口大小（与time_window一致）
    response_thresh_ratio: 0.5       # 响应阈值比例
    rise_rate_idx_min: 10            # 上升率计算最小索引
  
  freq:
    bands:                           # 频带划分
      - [0, 0.1]
      - [0.1, 0.3]
      - [0.3, 0.5]
    high_freq_filter:
      order: 3                       # 高通滤波器阶数
      cutoff: 0.1                    # 高通滤波截止频率
      type: 'high'                   # 滤波器类型
  
  period:
    peak_height_std_ratio: 0.5       # 峰值高度标准差倍数
    business_dist: 10                # 业务规则中的距离参数
    min_len: 50                      # 最小数据长度
  
  business:
    jump_window: 5                   # 跳跃检测窗口
    jump_ratio: 2.0                  # 跳跃比例阈值
    sync_tolerance: 10               # 同步容差
    fluctuation_w_ratio: 0.1         # 波动窗口比例
    pattern_thresh_high: 0.7         # 高阈值
    pattern_thresh_low: 0.3          # 低阈值

# 特征开关配置
features:
  include_statistical: true   # 统计特征(每通道20维)
  include_dynamic: true       # 动态响应特征(每通道25维)
  include_frequency: true     # 频域特征(每通道12维)
  include_stability: true     # 稳定性特征(每通道15维)
  include_periodicity: true   # 周期性特征(每通道8维)
  missing_channel_strategy: "zero"  # 缺失通道处理策略: zero/skip/error

# -------------------------------------------------
# 知识库文件（相对项目根目录）
# -------------------------------------------------
knowledge:
  fault_knowledge_file: "__PROJECT_ROOT__/Platform/configs/变桨轴X备用电源电压低.xlsx"
  label_column: '标签'
  id_column: '序号'

# -------------------------------------------------
# 数据划分配置
# -------------------------------------------------
data_split:
  test_size: 0.1          # 测试集比例 (10%)
  val_size: 0.111         # 验证集比例 (1/9 ≈ 11.1%)
  random_seed: 42         # 随机种子
  stratify: true          # 是否按标签进行分层抽样

# -------------------------------------------------
# 模型相关（保存、文件名）
# -------------------------------------------------
model:
  save_dir: "./data/saved_models"
  filename: '变桨轴X备用电源电压低.pt'

# -------------------------------------------------
# 模型训练配置
# -------------------------------------------------
training:
  random_seed: 42
  n_jobs: -1                         # 并行任务数 (-1表示使用所有CPU核心)
  
  models:
    RandomForest:
      n_estimators: 300
      max_depth: 12
      min_samples_leaf: 2
      class_weight: 'balanced'
    
    ExtraTrees:
      n_estimators: 300
      max_depth: 15
      min_samples_split: 5
      class_weight: 'balanced'
    
    XGBoost:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.05
      tree_method: 'hist'
      subsample: 0.8
      colsample_bytree: 0.7
    
    LightGBM:
      n_estimators: 200
      learning_rate: 0.05
      num_leaves: 31
      min_child_samples: 10
      class_weight: 'balanced'
      verbose: -1

# -------------------------------------------------
# 模型推理配置
# -------------------------------------------------
inference:
  device: 'cpu'                      # 推理设备 (cpu/cuda)
  weights_only: false                # 是否只加载权重

# -------------------------------------------------
# 输出配置
# -------------------------------------------------
output:
  format: "pt"  # 输出格式: pt (PyTorch张量)
  full_file: ./data/变桨轴X备用电源电压低/full_dataset.pt
  feature_dtype: "float64"  # 特征数据类型
  label_dtype: "int64"      # 标签数据类型
  
  # 输出文件路径
  train_file: "__PROJECT_ROOT__/Platform/data/变桨轴X备用电源电压低/train.pt"
  val_file: "__PROJECT_ROOT__/Platform/data/变桨轴X备用电源电压低/val.pt"
  test_file: "__PROJECT_ROOT__/Platform/data/变桨轴X备用电源电压低/test.pt"
  
  # 批量预测的输出位置
  prediction_csv: "__PROJECT_ROOT__/output_results/prediction_results.csv"
  prediction_report_img: "__PROJECT_ROOT__/output_results/prediction_report.png"

# -------------------------------------------------
# 日志配置
# -------------------------------------------------
logging:
  enable: true  # 是否启用日志
  error_file: "SCADA数据文件读取异常记录.txt"  # 错误日志文件名
  log_timestamp_format: '%Y%m%d_%H%M%S'
  debug_separator: '='
  debug_separator_length: 60
  checkpoint_save_top_k: 1
  monitor: 'val_loss'
  mode: 'min'
